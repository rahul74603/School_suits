name: Android APK (debug)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Code lo
        uses: actions/checkout@v4

      - name: Node lagao
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencies install karo
        run: npm ci

      - name: Binary files wapas lao (Capacitor template se)
        run: |
          rm -rf /tmp/cap-template && mkdir -p /tmp/cap-template
          tar -xzf node_modules/@capacitor/cli/assets/android-template.tar.gz \
            -C /tmp/cap-template
          cd /tmp/cap-template
          find . \( -name '*.jar' -o -name '*.png' \) \
            -exec cp --parents {} "$GITHUB_WORKSPACE/android/" \;
          cd "$GITHUB_WORKSPACE"
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          chmod +x android/gradlew
          echo "Binary files restore ho gayi:"
          find android \( -name '*.jar' -o -name '*.png' \) | wc -l

      # 🏫 School app ka web build (aam build — pura office app)
      - name: Web build (vite) — School app
        env:
          VITE_API_URL: https://school-guardian-api.onrender.com
        run: npx vite build

      - name: Capacitor sync (web build -> android project)
        run: npx cap sync android

      - name: Java lagao (Gradle ke liye)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: School APK banao (debug, school flavor)
        working-directory: android
        run: ./gradlew assembleSchoolDebug

      - name: School APK ka saaf naam rakho
        id: apk
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          cp android/app/build/outputs/apk/school/debug/app-school-debug.apk \
             "school-guardian-suite-${VERSION}.apk"
          echo "file=school-guardian-suite-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: School APK artifact upload karo (har run par milega)
        uses: actions/upload-artifact@v4
        with:
          name: school-guardian-suite-apk
          path: ${{ steps.apk.outputs.file }}

      # 👨‍👩‍👧 Parent App (v2.1) — ALAG app: web build VITE_PARENT_APP=1 ke
      # saath (sirf parent login + Parent Home), fir parent flavor ka APK.
      # Dhyaan: web assets dono apps me ek hi jagah (android project) jate
      # hain, isliye parent ka build school wale ke BAAD, dobara sync
      # karke hota hai — school APK pehle hi ban chuka hota hai.
      - name: Web build (vite) — Parent App
        env:
          VITE_API_URL: https://school-guardian-api.onrender.com
          VITE_PARENT_APP: "1"
        run: npx vite build

      - name: Capacitor sync (parent web build -> android project)
        run: npx cap sync android

      - name: Parent APK banao (debug, parent flavor)
        working-directory: android
        run: ./gradlew assembleParentDebug

      - name: Parent APK ka saaf naam rakho
        id: parentapk
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          cp android/app/build/outputs/apk/parent/debug/app-parent-debug.apk \
             "school-guardian-parent-${VERSION}.apk"
          echo "file=school-guardian-parent-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Parent APK artifact upload karo
        uses: actions/upload-artifact@v4
        with:
          name: school-guardian-parent-apk
          path: ${{ steps.parentapk.outputs.file }}

      # 👑 Master App (v2.2) — Super Admin ka ALAG app: web build
      # VITE_MASTER_APP=1 ke saath (sirf Schools control + Demo School
      # button), fir master flavor ka APK. Parent wali hi tarteeb:
      # web assets ek hi jagah jate hain, isliye ye build baaki dono
      # ke BAAD, dobara sync karke hota hai.
      - name: Web build (vite) — Master App
        env:
          VITE_API_URL: https://school-guardian-api.onrender.com
          VITE_MASTER_APP: "1"
        run: npx vite build

      - name: Capacitor sync (master web build -> android project)
        run: npx cap sync android

      - name: Master APK banao (debug, master flavor)
        working-directory: android
        run: ./gradlew assembleMasterDebug

      - name: Master APK ka saaf naam rakho
        id: masterapk
        run: |
          VERSION="${GITHUB_REF_NAME:-manual}"
          cp android/app/build/outputs/apk/master/debug/app-master-debug.apk \
             "school-guardian-master-${VERSION}.apk"
          echo "file=school-guardian-master-${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Master APK artifact upload karo
        uses: actions/upload-artifact@v4
        with:
          name: school-guardian-master-apk
          path: ${{ steps.masterapk.outputs.file }}

      - name: Tag par GitHub Release banao (direct download link)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.parentapk.outputs.file }}
            ${{ steps.masterapk.outputs.file }}
          generate_release_notes: true
