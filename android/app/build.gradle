apply plugin: 'com.android.application'

// --- SGS fixed internal signing: ONE key for every CI build, so each new APK
// installs as an update over the previous one (no signature mismatch).
def sgsKsB64 = file('keystore.b64')
def sgsKsFile = file('sgs-internal.p12')
if (sgsKsB64.exists() && !sgsKsFile.exists()) {
    try {
        sgsKsFile.bytes = java.util.Base64.getDecoder().decode(sgsKsB64.text.replaceAll('\\s', ''))
    } catch (Exception e) {
        logger.warn("SGS keystore decode failed: " + e.message)
    }
}

android {
    namespace "com.schoolguardian.suite"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.schoolguardian.suite"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 14
        versionName "3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // --- Teen apps, ek hi project (v2.1 parent, v2.2 master) --------------
    // school = aam School Guardian Suite (office/staff wala pura app).
    // parent = Guardian Parent — ALAG app: apna applicationId hai, isliye
    //   parent ke phone par school app ke saath-saath install ho sakta hai
    //   (aur school app ke update se iska data/login nahi udta). Iska web
    //   hissa VITE_PARENT_APP=1 wale vite build se banta hai (sirf parent
    //   login + Parent Home) — .github/workflows/android.yml me teeno
    //   build alag-alag hote hain.
    //   Label "Guardian Parent" flavor ke apne strings.xml se aata hai
    //   (src/parent/res/values/strings.xml — app_name override).
    // master = Guardian Master — Super Admin ka ALAG app (v2.2): apna
    //   applicationId, isliye teeno apps ek hi phone par saath install
    //   ho sakte hain. Iska web hissa VITE_MASTER_APP=1 wale vite build
    //   se banta hai (sirf Schools control + Demo School button).
    //   Label "Guardian Master" src/master/res/values/strings.xml se.
    // Signing: flavor me KOI alag signing setting nahi hai — neeche
    //   buildTypes.debug wali sgsInternal chaabi hi teeno flavors ko
    //   sign karti hai (signing block bilkul nahi badla gaya).
    flavorDimensions "app"
    productFlavors {
        school {
            dimension "app"
        }
        parent {
            dimension "app"
            applicationId "com.schoolguardian.parent"
        }
        master {
            dimension "app"
            applicationId "com.schoolguardian.master"
        }
    }
    signingConfigs {
        sgsInternal {
            if (sgsKsFile.exists()) {
                storeFile sgsKsFile
                storePassword 'gHsPOWmdEk5Eo6QOpPzL7mfr'
                keyAlias 'schoolguardian'
                keyPassword 'gHsPOWmdEk5Eo6QOpPzL7mfr'
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        debug {
            if (sgsKsFile.exists()) {
                signingConfig signingConfigs.sgsInternal
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
